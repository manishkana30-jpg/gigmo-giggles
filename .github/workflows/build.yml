name: Build, Harden and Validate Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      topic:
        description: "Forced topic title"
        required: false
        default: ""
      mock:
        description: "Run in mock mode"
        required: false
        default: "false"

jobs:
  validate-and-render:
    name: SRE Pipeline Run
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System FFmpeg, Blender, and Rhubarb
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg blender unzip
          
          # Download and install Rhubarb with robust folder-independent resolution
          wget -q -O rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/rhubarb-lip-sync-1.13.0-Linux.zip
          unzip -q -o rhubarb.zip
          
          BIN=$(find . -type f -executable -name "rhubarb" | head -n 1)
          if [ -z "$BIN" ]; then
            echo "Rhubarb Lip Sync binary not found after extraction"
            exit 1
          fi
          
          chmod +x "$BIN"
          BIN_DIR=$(dirname "$BIN")
          sudo mv "$BIN_DIR" /opt/rhubarb
          sudo ln -s /opt/rhubarb/rhubarb /usr/local/bin/rhubarb
          
          # Verify installations
          ffmpeg -version
          blender --version
          rhubarb --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure critical packages exist in environment
          pip install Pillow>=10.0.0 moviepy>=1.0.3
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Run Hardened Generator Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          TOPIC_FLAG=""
          if [ -n "${{ inputs.topic }}" ]; then
            TOPIC_FLAG="--topic \"${{ inputs.topic }}\""
          fi
          
          MOCK_FLAG=""
          if [ "${{ inputs.mock }}" = "true" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Running in Offline Mock Mode"
            MOCK_FLAG="--mock"
          fi
          
          python -m src.main $TOPIC_FLAG $MOCK_FLAG

      - name: Upload Episode Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-episode-${{ github.run_number }}
          path: episodes/
          retention-days: 14
