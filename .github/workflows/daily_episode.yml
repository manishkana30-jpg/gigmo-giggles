name: Daily Kids YouTube Episode Creator

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST / 01:00 AM EST)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional forced topic (leave blank to auto-select from catalog)"
        required: false
        default: ""
      mock:
        description: "Run in offline mock mode (zero API usage for testing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-generate:
    name: Generate Daily Episode
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Rhubarb (Zero-Fail Method)
        run: |
          set -euo pipefail
          # 1. Download and extract
          wget -q https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/rhubarb-lip-sync-1.13.0-Linux.zip
          unzip -q -o rhubarb-lip-sync-1.13.0-Linux.zip
          
          # 2. Move to the extracted folder and locate the binary (it's inside /bin!)
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -iname "*rhubarb*" | head -n 1)
          cd "$EXTRACTED_DIR"
          BIN_PATH=$(find . -type f -executable -name "rhubarb" | head -n 1)
          echo "📍 Found binary at: $BIN_PATH"
          
          # 3. Move it to system path
          sudo mv "$BIN_PATH" /usr/local/bin/rhubarb
          sudo chmod +x /usr/local/bin/rhubarb
          # Copy resource folder next to the executable to prevent pocket sphinx crash
          sudo cp -r res /usr/local/bin/
          
          # 4. Verify
          rhubarb --version
          echo "✅ Rhubarb installed successfully!"

      - name: Install FFmpeg, Blender & Clean Old Ghosts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender xvfb libegl1 libgl1 libxxf86vm1 libxfixes3 libxi6 libxrender1
          # Kill zombie temp files left by previous failed runs
          rm -rf /tmp/*_pipeline_*.mp3 /tmp/*_pipeline_*.wav || true
          rm -rf ./output/cache/* || true
          echo "🗑️ Zombie cache cleared."

      - name: Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          set -euo pipefail
          pytest -v

      - name: Run Episode Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          TOPIC_FLAG=""
          if [ -n "${{ inputs.topic }}" ]; then
            TOPIC_FLAG="--topic \"${{ inputs.topic }}\""
          fi
          
          PUBLISH_FLAG="--publish"
          MOCK_FLAG=""
          if [ "${{ inputs.mock }}" = "true" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ Running with mock/fallback mode (no live Gemini key provided or mock flag enabled)"
            MOCK_FLAG="--mock"
            PUBLISH_FLAG="--no-publish"
          fi
          
          python -u -m src.main $TOPIC_FLAG $MOCK_FLAG $PUBLISH_FLAG

      - name: Verify MP4 Was Generated
        run: |
          set -euo pipefail
          MP4=$(find episodes/ -name "episode.mp4" -type f 2>/dev/null | head -n 1)
          if [ -z "$MP4" ]; then
            echo "❌ No episode.mp4 found in episodes/"
            exit 1
          fi
          SIZE=$(stat --format=%s "$MP4")
          echo "✅ Found $MP4 ($SIZE bytes)"
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ MP4 is suspiciously small ($SIZE bytes)"
            exit 1
          fi

      - name: Upload Episode Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-episode-${{ github.run_number }}
          path: episodes/
          retention-days: 30
