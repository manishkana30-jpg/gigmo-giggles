name: Daily Kids YouTube Episode Creator

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST / 01:00 AM EST)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional forced topic (leave blank to auto-select from catalog)"
        required: false
        default: ""
        type: string
      mock:
        description: "Run in offline mock mode (zero API usage for testing)"
        required: false
        default: false
        type: boolean

jobs:
  build-and-generate:
    name: Generate Daily Episode
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Run Episode Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          TOPIC_FLAG=""
          if [ -n "${{ inputs.topic }}" ]; then
            TOPIC_FLAG="--topic \"${{ inputs.topic }}\""
          fi
          
          MOCK_FLAG=""
          if [ "${{ inputs.mock }}" = "true" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Running with mock/fallback mode (no live Gemini key provided or mock flag enabled)"
            MOCK_FLAG="--mock"
          fi
          
          python -m src.main $TOPIC_FLAG $MOCK_FLAG

      - name: Upload Episode Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-episode-${{ github.run_number }}
          path: episodes/
          retention-days: 14
